<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magic Book">
  <meta name="theme-color" content="#1b1035">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>The Magic Book</title>
  <style>
    :root { --bg:#1b1035; --card:#2a1c4f; --accent:#ffd54f; --text:#f4efff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,"Segoe UI",system-ui,sans-serif; }
    header { text-align:center; padding:18px 10px 8px; }
    header h1 { margin:0; font-size:28px; letter-spacing:.5px; }
    header p { margin:4px 0 0; opacity:.65; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:14px; padding:14px 14px 120px; max-width:960px; margin:0 auto; }
    .card { position:relative; border:0; border-radius:16px; overflow:hidden;
      background:var(--card); cursor:pointer; padding:0; box-shadow:0 4px 14px rgba(0,0,0,.4);
      transition:transform .08s ease; }
    .card:active { transform:scale(.96); }
    .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
    .card .num { position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55);
      color:#fff; font-weight:700; font-size:13px; border-radius:8px; padding:2px 8px; }
    .card .title { display:block; padding:10px 8px 12px; font-weight:600; font-size:14px;
      line-height:1.25; color:var(--text); }
    .card.playing { outline:3px solid var(--accent); }
    .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(27,16,53,.96);
      border-top:1px solid rgba(255,255,255,.12); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
      display:flex; align-items:center; gap:12px; transform:translateY(110%); transition:transform .2s ease; }
    .bar.show { transform:translateY(0); }
    .bar .info { flex:1; min-width:0; }
    .bar .info .lbl { font-size:11px; opacity:.6; text-transform:uppercase; letter-spacing:1px; }
    .bar .info .t { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stop { background:#e5484d; color:#fff; border:0; border-radius:999px; font-size:16px;
      font-weight:700; padding:12px 20px; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>✨ The Magic Book ✨</h1>
    <p>Tap a picture to begin</p>
  </header>
  <main class="grid">
      <button class="card" data-id="1" data-audio="audio/page-01.mp3">
        <img src="img/page-01.jpg" alt="Invisible Ice Floor" loading="lazy">
        <span class="num">1</span>
        <span class="title">Invisible Ice Floor</span>
      </button>
      <button class="card" data-id="2" data-audio="audio/page-02.mp3">
        <img src="img/page-02.jpg" alt="Moon-Tide Soccer" loading="lazy">
        <span class="num">2</span>
        <span class="title">Moon-Tide Soccer</span>
      </button>
      <button class="card" data-id="3" data-audio="audio/page-03.mp3">
        <img src="img/page-03.jpg" alt="Ribbon City Rescue" loading="lazy">
        <span class="num">3</span>
        <span class="title">Ribbon City Rescue</span>
      </button>
      <button class="card" data-id="4" data-audio="audio/page-04.mp3">
        <img src="img/page-04.jpg" alt="Gentle Giant" loading="lazy">
        <span class="num">4</span>
        <span class="title">Gentle Giant</span>
      </button>
      <button class="card" data-id="5" data-audio="audio/page-05.mp3">

        <span class="title">Sky Pup Parcel</span>
      </button>
      <button class="card" data-id="6" data-audio="audio/page-06.mp3">

      <button class="card" data-id="7" data-audio="audio/page-07.mp3">
        <img src="img/page-07.jpg" alt="Jellybean Jungle" loading="lazy">
        <span class="num">7</span>
        <span class="title">Jellybean Jungle</span>
      </button>
      <button class="card" data-id="8" data-audio="audio/page-08.mp3">
        <img src="img/page-08.jpg" alt="Salmon Signal Trail" loading="lazy">
        <span class="num">8</span>
        <span class="title">Salmon Signal Trail</span>
      </button>
      <button class="card" data-id="9" data-audio="audio/page-09.mp3">

        <span class="num">9</span>
        <span class="title">Lollipop Volcano</span>
      </button>
      <button class="card" data-id="10" data-audio="audio/page-10.mp3">
        <img src="img/page-10.jpg" alt="Cloud Tennis Orchestra" loading="lazy">
        <span class="num">10</span>
        <span class="title">Cloud Tennis Orchestra</span>

      <button class="card" data-id="11" data-audio="audio/page-11.mp3">

      <button class="card" data-id="12" data-audio="audio/page-12.mp3">
        <img src="img/page-12.jpg" alt="Dragon Basket Blast" loading="lazy">

        <span class="title">Dragon Basket Blast</span>
      </button>
      <button class="card" data-id="13" data-audio="audio/page-13.mp3">

        <span class="num">13</span>

      <button class="card" data-id="14" data-audio="audio/page-14.mp3">

      </button>

        <img src="img/page-15.jpg" alt="The Lost Star Post" loading="lazy">
        <span class="num">15</span>
        <span class="title">The Lost Star Post</span>
      </button>
      <button class="card" data-id="16" data-audio="audio/page-16.mp3">
        <img src="img/page-16.jpg" alt="Bubble Secret Agents" loading="lazy">
        <span class="num">16</span>
        <span class="title">Bubble Secret Agents</span>
      </button>
      <button class="card" data-id="17" data-audio="audio/page-17.mp3">

      <button class="card" data-id="18" data-audio="audio/page-18.mp3">

      <button class="card" data-id="19" data-audio="audio/page-19.mp3">
        <img src="img/page-19.jpg" alt="Comet Hand-Off" loading="lazy">
        <span class="num">19</span>
        <span class="title">Comet Hand-Off</span>
      </button>
      <button class="card" data-id="20" data-audio="audio/page-20.mp3">
        <img src="img/page-20.jpg" alt="The Grand Portal Parade" loading="lazy">
        <span class="num">20</span>
        <span class="title">The Grand Portal Parade</span>
      </button>
  </main>
  <div class="bar" id="bar">
    <div class="info"><div class="lbl">Now reading</div><div class="t" id="nowTitle"></div></div>
    <button class="stop" id="stopBtn">Stop ⏹</button>
  </div>
  <audio id="audio"></audio>
  <script>
    const audio = document.getElementById('audio');
    const bar = document.getElementById('bar');
    const nowTitle = document.getElementById('nowTitle');
    const cards = [...document.querySelectorAll('.card')];
    let current = null;

    function play(card) {
      if (current === card) { stop(); return; }
      stop();
      current = card;
      card.classList.add('playing');
      audio.src = card.dataset.audio;
      audio.play().catch(() => {});
      nowTitle.textContent = card.querySelector('.title').textContent;
      bar.classList.add('show');
    }
    function stop() {
      audio.pause(); audio.removeAttribute('src'); audio.load();
      if (current) current.classList.remove('playing');
      current = null; bar.classList.remove('show');
    }
    cards.forEach(c => c.addEventListener('click', () => play(c)));
    document.getElementById('stopBtn').addEventListener('click', stop);
    audio.addEventListener('ended', stop);
  </script>
</body>
</html>
